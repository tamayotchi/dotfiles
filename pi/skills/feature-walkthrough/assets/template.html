<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>/*__TITLE__*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --font: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --paper: #f4ebe0; --sheet: #f9f2e8; --card: #fbf6ef; --card-2: #f3e9dc;
  --line: #ddd3c5; --line-soft: #e8dfd2; --line-strong: #c6bbac;
  --ink: #1d1b18; --ink-2: #34302b; --muted: #6f6961; --muted-2: #8b847a;
  --wire: #1d1b18; --wire-off: #b0a698; --grid: #a8916f; --stage: #f7efe4;
  --good: #2f8a43; --warn: #b7791f; --bad: #c0392b; --none: #6f6961;
  --good-bg: #dcefd2; --warn-bg: #fbe5bd; --bad-bg: #f8d5cf;
  --green: #cfe3b2; --green-2: #b2d491; --violet: #e7ddf5; --blue: #d9e7f7; --sand: #efe1c9; --amber: #fbe5bd; --red: #f8d5cf; --teal: #d1ece8;
  --mark: #cfe3b2;
  --radius: 14px;
}
html[data-theme="dark"] {
  --paper: #191714; --sheet: #211e1a; --card: #26231f; --card-2: #2c2823;
  --line: #3a352f; --line-soft: #312d28; --line-strong: #4d463c;
  --ink: #efe6d6; --ink-2: #ddd3c2; --muted: #b0a698; --muted-2: #8f877c;
  --wire: #e9dfcd; --wire-off: #6f675c; --grid: #8a7a60; --stage: #1d1b18;
  --good: #8fd27f; --warn: #f0b955; --bad: #f08a7e; --none: #b0a698;
  --good-bg: #24371f; --warn-bg: #3b2f17; --bad-bg: #3f211d;
  --green: #2f4426; --green-2: #3f5a33; --violet: #33294a; --blue: #1f3247; --sand: #3a3123; --amber: #3d3119; --red: #45231f; --teal: #1e3a36;
  --mark: #3f5a33;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 13px/1.55 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
code { font-family: var(--font); background: var(--card-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; font-size: .95em; }
b, strong { color: var(--ink); font-weight: 700; }
.i { flex: none; vertical-align: -3px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-rows: 52px 1fr; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--paper); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand-mark { width: 30px; height: 30px; border: 1.5px solid var(--ink); border-radius: 8px; display: grid; place-items: center; background: var(--green); box-shadow: 0 2px 0 var(--ink); }
.brand em { font-style: normal; background: linear-gradient(transparent 55%, var(--mark) 55%); padding: 0 2px; }
.topbar .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card); box-shadow: 0 2px 0 var(--ink); cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tbtn:active { transform: translateY(2px); box-shadow: none; }
.tbtn.on { background: var(--green); }
.tbtn.icon { width: 34px; padding: 0; justify-content: center; }

.body { display: grid; grid-template-columns: 260px minmax(0, 1fr) 340px; gap: 14px; padding: 12px 14px 14px; min-height: 0; }
html.no-sidebar .body, html.presenter .body { grid-template-columns: minmax(0, 1fr) 360px; }
html.no-sidebar .sidebar, html.presenter .sidebar { display: none; }
html.presenter .goals-card { display: none; }
html.presenter .topbar { display: none; }
html.presenter .app { grid-template-rows: 1fr; }
html.presenter .step-body, html.presenter .callout .c-text, html.presenter .changes li { font-size: 14px; }
html.presenter .step-card h2 { font-size: 21px; }

/* ---------- sidebar ---------- */
.sidebar { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.course { flex: 1; overflow: auto; padding: 6px 4px; }
.course-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 8px 10px; font-weight: 700; font-size: 14px; }
.course-head span { color: var(--muted); font-size: 11px; font-weight: 500; }
.sec { margin-bottom: 4px; }
.sec-title { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-weight: 600; font-size: 13px; border-radius: 8px; cursor: pointer; user-select: none; }
.sec-title:hover { background: var(--card-2); }
.sec-title .count { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 500; }
.folder { width: 18px; height: 14px; border-radius: 3px; border: 1.3px solid var(--ink); flex: none; }
.sec-lessons { list-style: none; margin: 2px 0 8px 17px; padding: 0 0 0 12px; border-left: 1.5px solid var(--line-strong); }
.sec.closed .sec-lessons { display: none; }
.sec-lessons a { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 12.5px; border: 1.5px solid transparent; }
.sec-lessons a:hover { background: var(--card-2); }
.sec-lessons a.active { background: var(--green); border-color: var(--ink); box-shadow: 0 2px 0 var(--ink); font-weight: 600; color: var(--ink); }
.sec-lessons a .done { margin-left: auto; color: var(--good); }
.progress { border: 1px solid var(--line); border-radius: var(--radius); background: var(--sheet); padding: 12px 14px; display: flex; justify-content: space-between; font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }

/* ---------- main column ---------- */
.main { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 14px; }
.lesson-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: start; }
.crumb { grid-column: 1 / -1; color: var(--ink-2); font-size: 12px; }
.crumb .sep { color: var(--muted-2); margin: 0 6px; }
.lesson-head h1 { margin: 0; font-size: 27px; line-height: 1.15; letter-spacing: -.01em; }
.badges { display: flex; gap: 8px; align-self: center; flex-wrap: wrap; justify-content: flex-end; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1.5px solid var(--ink); border-radius: 999px; box-shadow: 0 2px 0 var(--ink); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.badge.t-amber { background: var(--amber); } .badge.t-green { background: var(--green); } .badge.t-violet { background: var(--violet); } .badge.t-red { background: var(--red); } .badge.t-sand { background: var(--sand); }
.summary { grid-column: 1 / -1; color: var(--muted); margin: 2px 0 0; }

.stage-card { flex: 1; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--stage); overflow: hidden; position: relative; }
.stage-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 12px 0; position: relative; z-index: 3; }
.metrics { display: flex; gap: 8px; flex-wrap: wrap; }
.metric { min-width: 108px; padding: 6px 12px 6px 11px; border: 1px solid var(--line); border-left: 3px solid var(--none); border-radius: 8px; background: var(--card); transition: border-color .4s; }
.metric .m-label { display: flex; align-items: center; gap: 5px; font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; }
.metric .m-val { font-size: 15px; font-weight: 800; color: var(--none); transition: color .4s; white-space: nowrap; }
.metric .m-delta { font-size: 10px; margin-left: 5px; color: var(--muted-2); font-weight: 600; }
.metric.lvl-good { border-left-color: var(--good); } .metric.lvl-good .m-val { color: var(--good); }
.metric.lvl-warn { border-left-color: var(--warn); } .metric.lvl-warn .m-val { color: var(--warn); }
.metric.lvl-bad { border-left-color: var(--bad); } .metric.lvl-bad .m-val { color: var(--bad); }
.metric.lvl-none .m-val { color: var(--ink); }
.metric.lvl-empty .m-val { color: var(--muted-2); }
.controls { display: flex; gap: 8px; flex: none; }

.stage { flex: 1; min-height: 0; position: relative; }
.stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage.zoomed { cursor: grab; } .stage.dragging { cursor: grabbing; }
.stage svg text { font-family: var(--font); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 6px 16px 10px; color: var(--muted); font-size: 11px; position: relative; z-index: 2; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 10px; height: 10px; border-radius: 50%; border: 1.3px solid #1d1b18; display: inline-block; }
.lg.req { background: #f3b47f; } .lg.res { background: #9fd28f; } .lg.retry, .lg.slow { background: #efb041; }
.lg.ping { background: #f4fbef; border: 2px solid #2f8a43; } .lg.event { background: #b79ce6; }
.lg.write { background: #5d5466; border-radius: 2px; } .lg.msg { background: #efb041; border-radius: 2px; } .lg.heavy { background: #e8834d; border-radius: 3px; width: 12px; height: 12px; }
.lg.fail { background: #e5534b; border-color: #8f2a22; position: relative; }
.lg.fail::after { content: "×"; position: absolute; inset: -4px 0 0 0; color: #fff; font-size: 10px; font-weight: 800; text-align: center; }

/* HUD card */
.hud { position: absolute; z-index: 4; min-width: 240px; max-width: 440px; background: var(--card); border: 1.5px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink); padding: 10px 14px 12px; transition: opacity .35s, transform .35s; pointer-events: none; color: var(--ink); }
.hud.hidden { opacity: 0; transform: translateY(8px); }
.hud.measure { visibility: hidden; left: -9999px; top: 0; transition: none; }
.hud-title { display: flex; align-items: center; gap: 7px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding-bottom: 7px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.hud-lines { font-size: 11.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.hud-lines .l-warn { color: var(--bad); } .hud-lines .l-eq { font-weight: 800; } .hud-lines .l-dim { color: var(--muted); } .hud-lines .l-ok { color: var(--good); }
.hud-bars { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-size: 11.5px; }
.hud-bars .track { position: relative; height: 13px; background: var(--line-soft); border-radius: 3px; min-width: 170px; }
.hud-bars .seg { position: absolute; top: 0; bottom: 0; border-radius: 3px; border: 1.2px solid var(--ink); }
.hud-bars .note { position: absolute; top: -2px; font-size: 10.5px; font-weight: 700; white-space: nowrap; padding-left: 5px; }
.seg.t-red { background: #e5534b; } .seg.t-green { background: #9fd28f; } .seg.t-amber { background: #efb041; } .seg.t-blue { background: #a9c5e8; } .seg.t-violet { background: #cbbae6; } .seg.t-gray { background: #c4bcb1; }
.hud-table { border-collapse: collapse; font-size: 11px; }
.hud-table td, .hud-table th { padding: 2px 10px 2px 0; text-align: left; white-space: nowrap; }
.hud-table th { color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }

/* timeline */
.timeline { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 10px 14px 12px; }
.tl-head { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px; }
.tl-head span:last-child { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500; }
.tl { display: flex; position: relative; }
.tl-step { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; position: relative; background: none; border: 0; padding: 0; }
.tl-step::before { content: ""; position: absolute; top: 12px; left: -50%; right: 50%; height: 2px; background: var(--line-strong); z-index: 0; }
.tl-step:first-child::before { display: none; }
.tl-step.done::before, .tl-step.cur::before { background: var(--ink); height: 3px; top: 11px; }
.tl-dot { width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid var(--muted-2); background: var(--card); display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: var(--muted); position: relative; z-index: 1; transition: all .25s; }
.tl-step.done .tl-dot { border-color: var(--ink); color: var(--ink); background: var(--card-2); }
.tl-step.cur .tl-dot { border-color: var(--ink); background: var(--green-2); color: var(--ink); box-shadow: 0 0 0 4px var(--green); transform: scale(1.06); }
.tl-label { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
.tl-step.cur .tl-label { color: var(--ink); font-weight: 700; }
.tl-step:hover .tl-dot { border-color: var(--ink); }

/* ---------- right column ---------- */
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.step-card { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px 12px; }
.step-scroll { flex: 1; min-height: 0; overflow: auto; padding-right: 4px; }
.step-meta { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 12px; letter-spacing: .06em; margin-bottom: 12px; }
.chip { padding: 2px 10px; border: 1.5px solid var(--ink); border-radius: 999px; box-shadow: 0 2px 0 var(--ink); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #1d1b18; }
.chip.t-sand { background: #efe1c9; } .chip.t-red { background: #f8d5cf; } .chip.t-green { background: #cfe3b2; } .chip.t-blue { background: #d6e5f6; } .chip.t-amber { background: #fbe5bd; } .chip.t-violet { background: #e7ddf5; } .chip.t-ink { background: #1d1b18; color: #f4ebe0; } .chip.t-teal { background: #d1ece8; }
.step-card h2 { margin: 0 0 10px; font-size: 18px; line-height: 1.3; }
.step-body p { margin: 0 0 12px; color: var(--ink-2); }
.step-body .term { font-weight: 700; color: var(--ink); background: linear-gradient(transparent 62%, var(--mark) 62%); padding: 0 1px; }
.step-body ul { margin: 0 0 12px; padding-left: 18px; color: var(--ink-2); }
.step-body ul.takeaways { list-style: none; padding: 0; }
.step-body ul.takeaways li { position: relative; padding: 0 0 8px 22px; }
.step-body ul.takeaways li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 15px; height: 15px; border: 1.3px solid var(--ink); border-radius: 4px; background: var(--green); font-size: 10px; line-height: 14px; text-align: center; font-weight: 800; color: var(--ink); }
.step-body table { border-collapse: collapse; width: 100%; font-size: 11.5px; margin: 0 0 12px; }
.step-body th, .step-body td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.step-body th { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.callout { display: grid; grid-template-columns: 28px 1fr; gap: 10px; border-radius: 10px; padding: 12px; margin: 4px 0 14px; border: 1px solid; }
.callout .c-ico { width: 28px; height: 28px; border-radius: 7px; border: 1.3px solid var(--ink); display: grid; place-items: center; background: var(--card); }
.callout .c-label { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.callout .c-text { font-size: 12px; color: var(--ink-2); }
.callout.k-tip { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.callout.k-warn { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.callout.k-insight, .callout.k-decision { background: var(--violet); border-color: color-mix(in srgb, #7c63d0 35%, transparent); }
.callout.k-next, .callout.k-info { background: var(--card-2); border-color: var(--line-strong); }
.changes-title { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; }
.changes { list-style: none; margin: 0 0 8px; padding: 0; }
.changes li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--ink-2); }
.changes .mk { width: 14px; height: 14px; border-radius: 3px; font-size: 10px; line-height: 14px; text-align: center; font-weight: 800; margin-top: 2px; }
.mk.add { background: var(--good-bg); color: var(--good); } .mk.mod { background: var(--warn-bg); color: var(--warn); } .mk.del { background: var(--bad-bg); color: var(--bad); }
.nav { display: grid; grid-template-columns: auto 1fr; gap: 10px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card); box-shadow: 0 2px 0 var(--ink); cursor: pointer; font-weight: 700; font-size: 12.5px; color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:not(:disabled):active { transform: translateY(2px); box-shadow: none; }
.btn.primary { background: var(--green); justify-content: space-between; min-width: 0; }
.btn.primary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.keys { margin-top: 8px; text-align: center; color: var(--muted-2); font-size: 10.5px; }
.keys kbd { font-family: var(--font); font-size: 9.5px; border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; background: var(--card); }
.goals-card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.goals-card h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.goals { list-style: none; margin: 0; padding: 0; }
.goals li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; margin-bottom: 7px; font-size: 12px; color: var(--muted); cursor: pointer; }
.goals li .box { width: 15px; height: 15px; border: 1.3px solid var(--muted-2); border-radius: 3px; margin-top: 2px; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: transparent; }
.goals li.on { color: var(--ink-2); }
.goals li.on .box { background: var(--green-2); border-color: var(--ink); color: var(--ink); }

/* overview */
.overview { grid-column: 1 / -1; overflow: auto; padding: 10px 8px 40px; }
.ov-hero { max-width: 1100px; margin: 20px auto 28px; }
.ov-hero h1 { font-size: 34px; margin: 0 0 6px; }
.ov-hero p { color: var(--muted); margin: 0 0 16px; max-width: 760px; font-size: 14px; }
.ov-sec { max-width: 1100px; margin: 0 auto 26px; }
.ov-sec h2 { display: flex; align-items: center; gap: 10px; font-size: 15px; margin: 0 0 12px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ov-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); text-decoration: none; color: var(--ink); transition: transform .15s; }
.ov-card:hover { transform: translateY(-2px); }
.ov-card h3 { margin: 0; font-size: 16px; }
.ov-card p { margin: 0; color: var(--muted); font-size: 12px; flex: 1; }
.ov-card .badges { justify-content: flex-start; }

/* ---------- svg bits ---------- */
.link { fill: none; stroke: var(--wire); stroke-width: 1.9px; stroke-linecap: round; stroke-linejoin: round; transition: stroke .4s; }
.link--dashed { stroke-dasharray: 5 4.5; }
.link--off { stroke: var(--wire-off); stroke-width: 1.6px; stroke-dasharray: 4 5; }
.link--hot { stroke: #c0392b; stroke-width: 2.2px; }
.link--good { stroke: #2f8a43; stroke-width: 2.1px; }
.arrowhead { fill: var(--wire); stroke: var(--wire); }
.arrowhead.off { fill: var(--wire-off); stroke: var(--wire-off); }
.arrowhead.hot { fill: #c0392b; stroke: #c0392b; }
.arrowhead.good { fill: #2f8a43; stroke: #2f8a43; }
.grid-line { stroke: var(--grid); }
.pkt circle, .pkt rect { fill: #f3b47f; stroke: #1d1b18; stroke-width: 1.5px; transition: fill .2s; }
.pkt--res circle { fill: #9fd28f; }
.pkt--retry circle, .pkt--slow circle { fill: #efb041; }
.pkt--ping circle { fill: #f4fbef; stroke: #2f8a43; stroke-width: 2.1px; }
.pkt--event circle { fill: #b79ce6; }
.pkt--write rect { fill: #5d5466; }
.pkt--msg rect { fill: #efb041; }
.pkt--heavy rect { fill: #e8834d; stroke-width: 1.7px; }
.pkt--fail circle { fill: #e5534b; stroke: #8f2a22; }
.pkt.back circle { fill: #9fd28f; }
